# Comparison branch: parses one local snapshot archive (Agave- or Firedancer-produced) and only
# publishes the JSONs as Buildkite artifacts. Nothing is read from or written to Google Cloud
# Storage, and nothing is posted to Slack.
agents:
  queue: "snapshots"

env:
  CLUSTER: "${CLUSTER-mainnet}"

steps:
  - label: ":closed_lock_with_key: Concurrency gate lock"
    command: echo "--> Start of concurrency gate"
    concurrency_group: 'solana-snapshot-parser/fetch-and-parse-${CLUSTER-mainnet}'
    concurrency: 1

  - input: "Which epoch to parse?"
    fields:
      - text: "Epoch"
        key: "epoch"
        format: "[0-9]+"
    if: "build.env('EPOCH') == null"

  - wait: ~

  - label: "🧹 Cleanup of leftover snapshot directories"
    commands:
    - working_dir=$(./scripts/cluster-config.bash "$$CLUSTER" WORKING_DIR)
    - |
      mkdir -p "$$working_dir"
      find "$$working_dir" -mindepth 1 -maxdepth 1 -type d -name 'snapshot-*' -print -exec rm -rf --preserve-root {} +

  - label: ":black_nib: Env variables setup"
    key: "setup-env-init"
    commands:
    - |
      epoch=${EPOCH:-$(buildkite-agent meta-data get epoch)}
      buildkite-agent meta-data set --redacted-vars='' epoch "$$epoch"
    - |
      local_snapshots=$(./scripts/cluster-config.bash "$$CLUSTER" LOCAL_SNAPSHOTS)
      local_snapshot_dir=$${LOCAL_SNAPSHOT_DIR:-$$local_snapshots}
      buildkite-agent meta-data set --redacted-vars='' local_snapshot_dir "$$local_snapshot_dir"
    - |
      echo "Cluster: '$$CLUSTER', Epoch: '$$epoch', Snapshot path: '$$SNAPSHOT_PATH', Local Snapshot Dir: '$$local_snapshot_dir'"

  - label: ":memo: Annotate retry parameters"
    depends_on: "setup-env-init"
    allow_dependency_failure: true
    commands:
      - epoch=$(buildkite-agent meta-data get epoch)
      - local_snapshot_dir=$(buildkite-agent meta-data get local_snapshot_dir)
      - |
        cat <<- EOF | buildkite-agent annotate --priority 6 --style info --context "general-info"
        ### Retry environment variables
        If you need to retry the build, use the following parameters:

        \`\`\`
        CLUSTER=$$CLUSTER
        EPOCH=$$epoch
        LOCAL_SNAPSHOT_DIR=$$local_snapshot_dir
        SNAPSHOT_PATH=$$SNAPSHOT_PATH
        \`\`\`
        EOF

  - label: ":globe_with_meridians: Cluster banner"
    commands:
    - annotation_style=$(./scripts/cluster-config.bash "$$CLUSTER" ANNOTATION_STYLE)
    - |
      echo "## Cluster: $$CLUSTER" | buildkite-agent annotate $${annotation_style:+--style "$$annotation_style"} --priority 10 --context "cluster"

  - wait: ~

  - label: ":file_folder: Prepare snapshot directory"
    commands:
    - ulimit -a
    - epoch=$(buildkite-agent meta-data get epoch)
    - local_snapshot_dir=$(buildkite-agent meta-data get local_snapshot_dir)
    - working_dir=$(./scripts/cluster-config.bash "$$CLUSTER" WORKING_DIR)
    - |
      mkdir -p "$$working_dir"
      snapshot_dir=$(mktemp --directory -p "$$working_dir" "snapshot-$$epoch-$(date +%s)-XXXXXX")
      buildkite-agent meta-data set --redacted-vars="" snapshot_dir "$$snapshot_dir"

      # SNAPSHOT_PATH names one archive (e.g. a Firedancer-produced one); otherwise the epoch's archive in the local dir
      if [[ -n "$$SNAPSHOT_PATH" ]]; then
        local_snapshot=$$SNAPSHOT_PATH
      else
        local_snapshot=$(find $$local_snapshot_dir/*/$$epoch/ -name 'snapshot-*.tar.zst' 2>/dev/null | head -1)
      fi
      if [[ -z "$$local_snapshot" || ! -f "$$local_snapshot" ]]; then
        echo "No local snapshot for epoch $$epoch (SNAPSHOT_PATH='$$SNAPSHOT_PATH', LOCAL_SNAPSHOT_DIR='$$local_snapshot_dir'); this branch never fetches from Google Cloud Storage" >&2
        exit 1
      fi
      echo "Using local snapshot: $$local_snapshot"
      cp -- "$$local_snapshot" "$$snapshot_dir/"
      echo "Snapshot parsed: \`$$(basename "$$local_snapshot")\`" | buildkite-agent annotate --style info --context "snapshot-source"

  - wait: ~

  - label: ":cloud: :arrow_right: :floppy_disk: Fetch genesis"
    commands:
    - snapshot_dir=$(buildkite-agent meta-data get snapshot_dir)
    - genesis_rpc_url=$(./scripts/cluster-config.bash "$$CLUSTER" GENESIS_RPC_URL)
    - ./scripts/fetch-genesis.bash "$$snapshot_dir" "$$genesis_rpc_url"

  - label: ":hammer_and_wrench: :rust: Build"
    commands:
    - . "$HOME/.cargo/env"
    - cargo build --release --bin snapshot-parser-validator-cli
    - '[ "$${CARGO_TARGET_DIR:-target}" = target ] || install -D -t target/release "$$CARGO_TARGET_DIR"/release/snapshot-parser-validator-cli'
    artifact_paths:
      - target/release/snapshot-parser-validator-cli

  - wait: ~

  - label: ":microscope: Parse Snapshot"
    env:
      RUST_BACKTRACE: full
      # RUST_LOG: trace
    artifact_paths:
        - ./validators.json
        - ./stakes.json
        - ./jito-stake-meta-*.json
        - ./leader-schedule.json
    commands:
    - snapshot_dir=$(buildkite-agent meta-data get snapshot_dir)
    - tip_distribution_program=$(./scripts/cluster-config.bash "$$CLUSTER" TIP_DISTRIBUTION_PROGRAM)
    - tip_payment_program=$(./scripts/cluster-config.bash "$$CLUSTER" TIP_PAYMENT_PROGRAM)
    - require_priority_fee_data=$(./scripts/cluster-config.bash "$$CLUSTER" REQUIRE_PRIORITY_FEE_DATA)
    - buildkite-agent artifact download --include-retried-jobs target/release/snapshot-parser-validator-cli .
    - chmod +x target/release/snapshot-parser-validator-cli
    - |
      # The annotation below reads "file exists" as "this run produced it", so no earlier attempt's may be left
      rm -f ./validators.json ./stakes.json ./leader-schedule.json ./jito-stake-meta-*.json

      # --require-leader-schedule false is what makes a missing schedule survivable; the exit code decides the rest
      ./target/release/snapshot-parser-validator-cli \
        --ledger-path "$$snapshot_dir" \
        --output-validator-meta-collection "./validators.json" \
        --output-stake-meta-collection "./stakes.json" \
        --output-jito-stake-meta "./jito-stake-meta-{hash}.json" \
        --output-leader-schedule "./leader-schedule.json" \
        --tip-distribution-program "$$tip_distribution_program" \
        --tip-payment-program "$$tip_payment_program" \
        --require-priority-fee-data "$$require_priority_fee_data" \
        --require-jito-stake-meta true \
        --require-leader-schedule false

      if [[ ! -f ./leader-schedule.json ]]; then
        echo "No leader schedule was produced! See the parser output above." | buildkite-agent annotate --style warning --context "leader-schedule"
      fi
    - |
      if ! ./scripts/find-jito-stake-meta.bash . > /dev/null; then
        echo "No single, validly named Jito stake meta collection was produced! See the parser output above." | buildkite-agent annotate --style error --context "jito-stake-meta"
        exit 1
      fi

  - wait: ~

  - label: "🗑️ Cleanup"
    commands:
    - snapshot_dir=$(buildkite-agent meta-data get snapshot_dir)
    - 'echo "Cleaning snapshot dir: $$snapshot_dir"'
    - rm -rf --preserve-root "$$snapshot_dir"

  - wait: ~

  - label: ":unlock: Concurrency gate unlock"
    command: echo "End of concurrency gate <--"
    concurrency_group: 'solana-snapshot-parser/fetch-and-parse-${CLUSTER-mainnet}'
    concurrency: 1
