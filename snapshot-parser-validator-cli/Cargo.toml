[[bin]]
name = "snapshot-parser-validator-cli"
path = "src/bin/cli.rs"

[package]
publish = false
name = "snapshot-parser-validator-cli"
version = "0.0.0"
edition = "2021"
license.workspace = true

[dependencies]
agave-feature-set = { workspace = true }
ahash = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
crc = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
snapshot-parser = { workspace = true }
solana-loader-v3-interface = { workspace = true }
solana-runtime = { workspace = true }
solana-accounts-db = { workspace = true }
solana-program = { workspace = true }
solana-sdk = { workspace = true }
solana-stake-interface = { workspace = true }
solana-vote = { workspace = true }

[dev-dependencies]
# pins the copied migration marker to agave's and builds genesis certificates for tests only
agave-votor-messages = { workspace = true }
serde_json = { workspace = true }
# dev-context-only-utils gates Bank::new_for_tests, which the points oracle test runs agave's rewards on
solana-runtime = { workspace = true, features = ["dev-context-only-utils"] }
# constructs VoteStateV3/V4 fixtures for tests only
solana-vote-interface = { workspace = true }
