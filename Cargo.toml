[workspace]
members = [
    "snapshot-parser",
    "snapshot-parser-validator-cli",
    "snapshot-parser-tokens-cli",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[workspace.package]
license = "Apache-2.0"


[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3

[workspace.dependencies]
# already in Cargo.lock as a transitive dependency of solana-runtime at the same
# pinned version; declared here so the feature-flag reads are testable
agave-feature-set = "=4.3.0"
agave-votor-messages = { version = "=4.3.0", features = ["agave-unstable-api"] }
ahash = "0.8.12"
borsh = { version = "1", features = ["derive"] }
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
bs58 = "0.5.1"
bincode = "1.3.3"
clap = { version = "4.1.11", features = ["derive", "env"] }
crc = "3.4.0"
env_logger = "0.11.10"
indicatif = { version = "0.18.4"}
log = "0.4.29"
rayon = "1.12.0"
spl-token = { version = "9.0.0" }
rusqlite = { version = "0.39.0", features = ["bundled", "fallible_uint"] }
serde = "1.0.228"
serde_json = "1.0.149"
shellexpand = "3.1.2"
snapshot-parser = { path = "./snapshot-parser" }
agave-snapshots = "=4.3.0"
solana-genesis-utils = "=4.3.0"
solana-ledger = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-loader-v3-interface = { version = "=7.0.0", features = ["serde"] }
solana-native-token = "=3.0.0"
solana-program = "=4.0.0"
solana-runtime = "=4.3.0"
solana-sdk = "=4.0.1"
solana-accounts-db = "=4.3.0"
solana-stake-interface = { version = "=4.4.0", features = ["serde", "sysvar"] }
solana-vote = { version = "=4.3.0", features = ["agave-unstable-api"] }
solana-vote-interface = { version = "=6.1.0", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
# pinned to the version solana-runtime decodes its EpochInflationAccountState with
wincode = { version = "=0.6.2", features = ["derive"] }

[patch.crates-io]
# solana-ledger 4.3.0 calls rocksdb APIs only agave's fork has, the rev of agave v4.3.0's own patch
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
